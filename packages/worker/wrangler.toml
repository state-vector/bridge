name = "bridge"
main = "src/index.js"
compatibility_date = "2026-01-15"
# account_id comes from CLOUDFLARE_ACCOUNT_ID in the environment — not committed.

# The workers.dev subdomain stays enabled explicitly: defining routes makes
# wrangler's default flip to disabled, and a deploy from this file then
# silently stopped serving https://<subdomain>.workers.dev (the 2026-10-27
# NXDOMAIN that left desktops "bridge unreachable" mid-startup).
workers_dev = true

# The shared hub also answers on our own domain — attached as a Workers
# custom domain on deploy (the DNS record + edge cert are created on the
# zone automatically). console.fleetbridge.run stays attached as an alias.
# NOTE: top-level, NOT under [build] — nesting it there made wrangler parse
# it as build.routes, warn "Unexpected fields", and silently drop the
# custom-domain attachment from every deploy.
routes = [
  { pattern = "hub.fleetbridge.run", custom_domain = true },
]

# The served UI lives in @bridge/webapp, built to dist at deploy time by this
# hook — dist is a build ARTIFACT, never committed; the source of truth is
# packages/webapp/src and Cloudflare builds from it on every deploy.
# Self-sufficient on purpose: this project's Workers Builds root is
# packages/worker, so the install step only materializes the worker's
# dependency subtree (90 pkgs — no vite/tsc/react) and `npm run -w` from a
# subdirectory does not put the hoisted .bin on the script's PATH anyway.
# Install what the build needs, then invoke vite by path. Typechecking stays
# in CI's full-install job.
[build]
command = "printf '{\"commit\":\"%s\",\"built_at\":\"%s\"}' \"$(git rev-parse HEAD 2>/dev/null || echo unknown)\" \"$(date -u +%FT%TZ)\" > src/__version.json && cd ../webapp && npm install --no-save --silent && ../../node_modules/.bin/vite build"


# Workers AI: re-enable by adding [ai] binding = "AI" once the deploy env has
# CLOUDFLARE_API_TOKEN (local dev fails without it). Until then search = FTS + trigram fuzzy.
[durable_objects]
bindings = [
  { name = "HUB", class_name = "FlowsHub" },
  { name = "KB", class_name = "KnowledgeHub" },
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FlowsHub"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["KnowledgeHub"]

# Webapp deployment: @bridge/webapp is built to dist and served as worker assets,
# same origin as /ws + /api/state (Access cookie just works; no CORS).
# API/WS/legacy-UI routes hit the worker first; everything else is the SPA.
[assets]
directory = "../webapp/dist"
not_found_handling = "single-page-application"
# BR#3885: /v1/models joins the same law that put /api/token/repair here
# (372bbe973) — a route missing from this list is silently eaten by the SPA
# assets layer. Any new worker-handled path MUST be added here.
run_worker_first = ["/__version", "/ingest", "/v1/models", "/api/state", "/api/session", "/api/workspaces", "/api/workspaces/*", "/api/pair/*", "/api/token/repair", "/ws", "/ui", "/login", "/login/callback", "/logout", "/mcp", "/api/kb/*", "/api/kb-machine/*", "/token.rename", "/kb-ws"]

[vars]
# The model registry (BR#3885): comma-separated ids served by GET /v1/models
# in OpenAI shape — the list the CLI doctor's pinned-model check resolves
# against (trim + dedupe applied; empty = 0 ids served, a named doctor FAIL).
# Set it HERE, not in the dashboard — this file is the deploy truth and a
# push would clobber dashboard-only vars. e.g.
#   MODEL_IDS = "sp-gateway/glm-5.3-flash,glm-4.7"
MODEL_IDS = ""
# Overridden by `wrangler secret put` at deploy:
#   GITHUB_CLIENT_ID      GitHub OAuth app client id (human sign-in)
#   GITHUB_CLIENT_SECRET  GitHub OAuth app client secret (also HMAC-signs session cookies)
#   BRIDGE_INGEST_TOKEN    shared bearer for POST /ingest (legacy FLOWS_INGEST_TOKEN still accepted during rotation)
#   CF_ACCESS_TEAM        optional: https://<team>.cloudflareaccess.com (edge JWT mode)
#   CF_ACCESS_AUD         optional: Access application AUD tag
#   GITHUB_TOKEN          optional: raises the invite-time GitHub username lookup rate limit (60/hr shared egress IP → 5000/hr)
