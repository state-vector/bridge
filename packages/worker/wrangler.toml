name = "bridge"
main = "src/index.js"
compatibility_date = "2026-01-15"
account_id = "013b6a2b6f3dfb6c8d48657769681087"

# Live URL: https://bridge.ray-013.workers.dev (Workers subdomain: ray-013).
# workers_dev stays true so both `wrangler deploy` from the box and CF's git
# integration publish to that URL.

# PR pipeline note: CF's git integration runs `npx wrangler preview` on
# non-main branches; wrangler 4.x refuses without a `previews` block (can be
# empty — settings stay at top level).
[previews]

[durable_objects]
bindings = [{ name = "HUB", class_name = "FlowsHub" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FlowsHub"]

# Webapp deployment: @flows/webapp is built to dist and served as worker assets,
# same origin as /ws + /api/state (Access cookie just works; no CORS).
# API/WS/legacy-UI routes hit the worker first; everything else is the SPA.
[assets]
directory = "../webapp/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/ingest", "/api/state", "/ws", "/ui", "/login", "/logout"]

[vars]
# Overridden by `wrangler secret put` at deploy:
#   FLOWS_INGEST_TOKEN  shared bearer for POST /ingest
#   CF_ACCESS_TEAM      https://<team>.cloudflareaccess.com
#   CF_ACCESS_AUD       02bf2012058821d837180e16d3146cc0
