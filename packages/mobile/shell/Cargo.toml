[package]
name = "bridge-mobile"
version = "0.1.0"
description = "Bridge — native iOS shell wrapping @bridge/mobile-ui (hub-REST-only, fork-free per ADR BR#998)"
authors = ["state-vector"]
edition = "2021"

[lib]
name = "bridge_mobile_lib"
# staticlib: what the Xcode app target links (libapp.a); the FM voice symbols
# (fm_voice_*) are provided at final link by gen/apple Swift — a standalone
# cdylib link can never see them, so it is not emitted.
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MCP JSON-RPC client for the voice console (hub /mcp, machine plane).
ureq = { version = "2", default-features = false, features = ["tls", "gzip", "json"] }

# iOS notification core — the mac_notify.rs pattern carried over: UNUserNotificationCenter,
# one category per ask (option ids as action ids), delegate converts taps into Tauri events.
# Gated to iOS: the desktop crate owns its own macOS copy (packages/desktop/src-tauri).
[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSArray", "NSSet", "NSError"] }
objc2-user-notifications = { version = "0.3.2", features = [
  "block2",
  "UNUserNotificationCenter",
  "UNNotificationRequest",
  "UNNotificationContent",
  "UNNotificationCategory",
  "UNNotificationAction",
  "UNNotificationResponse",
  "UNNotificationSound",
] }
# Voice (BR#4782): on-device speech recognition (Speech) + speech synthesis and
# the microphone audio graph (AVFAudio). Same objc2 pattern as the notification core.
objc2-speech = { version = "0.3.2", features = [
  "SFSpeechRecognizer",
  "SFSpeechRecognitionRequest",
  "SFSpeechRecognitionTask",
  "SFSpeechRecognitionResult",
  "SFTranscription",
] }
objc2-avf-audio = { version = "0.3.2", features = [
  "AVAudioEngine",
  "AVAudioSession",
  "AVAudioNode",
  "AVAudioIONode",
  "AVAudioTypes",
  "AVSpeechSynthesis",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
