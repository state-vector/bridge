[package]
name = "bridge-desktop"
version = "0.1.0"
description = "Bridge — the decision inbox menubar app"
authors = ["state-vector"]
edition = "2021"

[lib]
name = "bridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
# Data Protection keychain (kSecUseDataProtectionKeychain) — NOT the login
# keychain; scoped to this app, no ACL prompts. OSX_10_15 gates the flag.
security-framework = { version = "3", features = ["OSX_10_15"] }
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSArray", "NSSet", "NSDictionary", "NSError"] }
objc2-user-notifications = { version = "0.3.2", features = ["block2", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationCategory", "UNNotificationAction", "UNNotificationResponse", "UNNotificationSound"] }
# Apple's on-device LLM (FoundationModels, macOS 26+) — the console summariser
foundation-models = { version = "0.12", features = ["macos_26_0"] }

# Binary named "Bridge": macOS derives the menu-bar app name from the process
# name — "bridge-desktop" showed a blank menu bar title in dev.
[[bin]]
name = "Bridge"
path = "src/main.rs"
