name: dev-build
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# rapid main pushes replace, not queue — the newest commit's binaries win
concurrency:
  group: dev-build-main
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/cli
          key: ${{ matrix.target }}
      - name: Build bridge CLI (dev)
        working-directory: packages/cli
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          BIN=packages/cli/target/${{ matrix.target }}/release/bridge
          file "$BIN"
          ASSET="bridge-${{ matrix.target }}.tar.gz"
          tar -czf "$ASSET" -C "$(dirname "$BIN")" bridge
          sha256sum "$ASSET" > "$ASSET.sha256"
      - name: Publish to rolling dev release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: dev
          prerelease: true
          make_latest: "false"
          overwrite_files: true
          body: |
            Rolling dev build of `main` @ ${{ github.sha }}.

            Pre-release — `install.sh` with no arguments and `releases/latest`
            always resolve to the newest *versioned* release, never this one.

            Install the dev channel:

                curl -fsSL https://raw.githubusercontent.com/state-vector/bridge/main/install.sh | bash -s -- dev
          files: |
            bridge-*.tar.gz
            bridge-*.tar.gz.sha256
