name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Worker unit tests (kb core) + contracts + webapp build + specs gate
        run: |
          python3 -m unittest discover -s packages/cli/updater -p 'test_*.py'
          npm run test -w packages/contracts
          npm run test -w packages/worker
          npm run build -w @bridge/webapp
          npm run test -w @bridge/specs
      - name: Worker bundle check (wrangler dry-run)
        working-directory: packages/worker
        run: npx wrangler deploy --dry-run

  cli:
    name: CLI build (packages/cli)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/cli
      # the CLI vendors the desktop dispatch core via #[path] — a desktop-side
      # refactor must not be discoverable only when a release builds
      - name: Compile check (locked)
        working-directory: packages/cli
        run: cargo check --locked --all-targets
      # the credential/config store regression suite (BR#2840): atomic
      # writes, rotate-in-one-call, write-once principal, legacy migration
      # — these gate the merge, not just the release build
      - name: CLI tests (locked)
        working-directory: packages/cli
        run: cargo test --locked

  deploy-check:
    name: Deploy drift alarm
    runs-on: ubuntu-latest
    # the 10-min settle window (BR#3289) must fit under the job timeout:
    # up to 600s of polling + checkout + probe overhead
    timeout-minutes: 15
    needs: test
    # main pushes only: the alarm compares the LIVE hub (which deploys
    # main via CF Workers Builds) against the pushed SHA — on a PR event
    # github.sha is the PR head, which the live hub can never match
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # the settle-window alarm reads main's tip (gh api commits/main) so a
    # superseded push goes green-by-tip; read-only is all it needs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Probe live hub __version vs pushed SHA (settle window)
        # BR#3289: the hub deploys asynchronously, so a first-probe failure
        # read "main is broken" on every push. The settle logic lives in the
        # script: warn (non-failing) while the deploy is in flight, fail only
        # when the window elapses with the hub stale or unreachable.
        env:
          HUB_URL: https://bridge.ray-013.workers.dev
          EXPECTED_SHA: ${{ github.sha }}
          DEPLOY_DRIFT_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/deploy-drift-alarm.sh

  ios-sim:
    name: iOS simulator build (packages/mobile/shell)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/mobile/shell
      # npm ci is load-bearing: tauri.conf.json's beforeBuildCommand builds the
      # mobile-ui dist, which fails without node_modules (the BR#2620 round-1 RED)
      - run: npm ci
      - name: Build mobile-ui dist
        run: npm run build -w @bridge/mobile-ui
      # sim target needs no signing; the receipt proves the iOS-target build
      # compiles on every push/PR (BR#2514 done-when, BR#1766 Gate 1)
      - name: Tauri iOS build (aarch64-sim)
        working-directory: packages/mobile/shell
        run: npx tauri ios build --target aarch64-sim
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: bridge-ios-sim-app
          path: packages/mobile/shell/gen/apple/build/arm64-sim/*.app
          if-no-files-found: error
