# The destination-green stop-the-line gate (BR#3008, accepted decision BR#3009).
#
# Merges must not land while destination main is red. This workflow runs on
# every PR and reports the `main-green gate` check; the ruleset
# "main: main-green gate required" makes it a required check, so GitHub
# mechanically refuses the merge while main's HEAD has failing checks. The
# remediation carve-out (PR green on the exact checks main fails) lives in
# scripts/main-green-gate.sh — the remediation-merge path from BR#3009.
#
# The loud half of stop-the-line — the board alert — does not live here: the
# hub's watchdog sweep (packages/worker/src/kb/do.ts, stopTheLineSweep) files
# ONE urgent ask per red episode, deduped per main-HEAD sha, independent of
# any PR. A red main must page the board even when nobody opens a PR.
name: main-green gate

on:
  pull_request:
  # Manual re-check / red-green drills: judge an EXPLICIT historic sha
  # (main_sha, with pr_sha for the remediation carve-out) to reproduce a
  # historic episode without waiting for one.
  #
  # main_sha is REQUIRED on dispatch (BR#5487): a sha-less dispatch with
  # --ref main runs on main's HEAD, attaches its own `main-green gate`
  # check-run to that sha, and the script then finds itself in flight on the
  # very commit it judges — UNSETTLED → exit 1, reding a green main (run
  # 41391348652). Judging a historic sha breaks the self-reference: the
  # check-run still lands on HEAD, but the judged commit is settled and
  # independent. Never pass live HEAD. The guard step below is the in-run
  # backstop for any API path that still slips a sha-less dispatch through.
  workflow_dispatch:
    inputs:
      main_sha:
        description: "main sha to judge (REQUIRED — a historic, settled sha; never live HEAD)"
        required: true
      pr_sha:
        description: "PR head sha for the remediation carve-out (optional)"
        required: false

permissions:
  contents: read
  checks: read

defaults:
  run:
    shell: bash

jobs:
  gate:
    # The check-run name is the JOB name — it must stay byte-identical to the
    # context in the ruleset ("main: main-green gate required").
    name: main-green gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Refuse a sha-less drill (BR#5487 — the gate must never judge its own run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.main_sha == ''
        run: |
          echo "REFUSED — a workflow_dispatch drill MUST pass an explicit main_sha (BR#5487)."
          echo "A sha-less dispatch with --ref main attaches THIS run's own 'main-green gate'"
          echo "check-run to main's HEAD; the script then finds itself in flight on the sha it"
          echo "judges and fails as UNSETTLED, reding a green main (run 41391348652)."
          echo "Re-run with main_sha set to a HISTORIC, settled commit — never live HEAD."
          exit 1
      - name: Assert destination main is green (or this PR remediates it)
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_GREEN_REPO: ${{ github.repository }}
          MAIN_GREEN_SHA: ${{ github.event.inputs.main_sha }}
          MAIN_GREEN_PR_SHA: ${{ github.event.pull_request.head.sha || github.event.inputs.pr_sha }}
        run: bash scripts/main-green-gate.sh
