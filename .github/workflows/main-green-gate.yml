# The destination-green stop-the-line gate (BR#3008, accepted decision BR#3009),
# as the SHARED definition every repo references (BR#5518).
#
# Merges must not land while destination main is red. Three ways in, one rule:
#
#   - pull_request — this repo's own PRs: the gate judges state-vector/bridge's
#     main directly. This workflow is its own first caller; no other copy of
#     the script or workflow exists anywhere.
#   - workflow_call — every other repo wires it with a 3-line caller workflow:
#       name: main-green gate
#       on: [pull_request]
#       jobs:
#         gate:
#           name: main-green gate   # byte-identical to your ruleset context
#           uses: state-vector/bridge/.github/workflows/main-green-gate.yml@vN
#     Pin the ref (@vN), NEVER @main: a bad gate change must not break every
#     repo's merge gate simultaneously — bump the tag deliberately (BR#5518).
#   - workflow_dispatch — manual re-check / red-green drills. BR#5487 law: a
#     drill MUST pass an explicit main_sha (a historic sha, never live HEAD);
#     the composite action refuses a sha-less drill loudly.
#
# The check-run name is the JOB name — it must stay byte-identical to the
# context in the ruleset ("main: main-green gate required"). Cross-repo
# callers must name their caller job `main-green gate` for the same reason.
#
# The loud half of stop-the-line — the board alert — does not live here: the
# hub's watchdog sweep (packages/worker/src/kb/do.ts, stopTheLineSweep) files
# ONE urgent ask per red episode, deduped per main-HEAD sha, independent of
# any PR. A red main must page the board even when nobody opens a PR.
name: main-green gate

on:
  pull_request:
  # Manual re-check / red-green drills: judge an EXPLICIT historic sha
  # (main_sha, with pr_sha for the remediation carve-out) to reproduce a
  # historic episode without waiting for one.
  #
  # main_sha is REQUIRED on dispatch (BR#5487): a sha-less dispatch with
  # --ref main runs on main's HEAD, attaches its own `main-green gate`
  # check-run to that sha, and the script then finds itself in flight on the
  # very commit it judges — UNSETTLED → exit 1, reding a green main (run
  # 41391348652). Judging a historic sha breaks the self-reference: the
  # check-run still lands on HEAD, but the judged commit is settled and
  # independent. Never pass live HEAD. The composite action's drill guard is
  # the in-run backstop for any API path that still slips a sha-less
  # dispatch through.
  workflow_dispatch:
    inputs:
      main_sha:
        description: "main sha to judge (REQUIRED — a historic, settled sha; never live HEAD)"
        required: true
      pr_sha:
        description: "PR head sha for the remediation carve-out (optional)"
        required: false
        type: string
  workflow_call:
    inputs:
      main_sha:
        description: "main HEAD sha to judge (default: caller's live main)"
        required: false
        type: string
      pr_sha:
        description: "PR head sha for the remediation carve-out (optional)"
        required: false
        type: string

permissions:
  contents: read
  checks: read

defaults:
  run:
    shell: bash

jobs:
  gate:
    # The check-run name is the JOB name — it must stay byte-identical to the
    # context in the ruleset ("main: main-green gate required"). Cross-repo
    # callers: name your caller job `main-green gate` too.
    name: main-green gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/main-green-gate
        with:
          # The gate vouches for the CALLER's main: github.repository is the
          # calling repo in workflow_call context, this repo otherwise.
          repo: ${{ github.repository }}
          main-sha: ${{ github.event.inputs.main_sha || inputs.main_sha || '' }}
          pr-sha: ${{ github.event.pull_request.head.sha || github.event.inputs.pr_sha || inputs.pr_sha || '' }}
