name: deploy-worker
on:
  push:
    branches: [main]
    paths:
      - "packages/worker/**"
      - "packages/specs/schemas/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace deps
        run: npm install

      - name: Specs consistency gate
        run: npm run test -w packages/specs

      - name: Deploy Worker
        working-directory: packages/worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 013b6a2b6f3dfb6c8d48657769681087
